# =============================================================================
# Docker Compose 設定
# =============================================================================
# なぜ Docker Compose を使うか:
#   - 環境変数、ポートマッピング、ボリュームマウント等の設定を宣言的に管理
#   - `docker compose up` 一発で開発環境を構築できる
#   - チーム全員が同じ環境で開発できる（「自分の環境では動く」問題を回避）
#
# godotenv を使わない理由:
#   Docker Compose の env_file ディレクティブが .env ファイルを読み込み、
#   コンテナの環境変数として設定する。アプリケーション側で .env パーサーを
#   実装する必要がない。これは Go の標準ライブラリのみで動作させるという
#   このプロジェクトの方針にも合致する。
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # フロントエンドを読み取り専用でマウント
      # なぜ読み取り専用（:ro）か: コンテナからホストのファイルを誤って変更しない
      # なぜボリュームマウントか: HTML/JS を編集すると即座に反映される（再ビルド不要）
      - ./frontend:/app/frontend:ro
    restart: unless-stopped
